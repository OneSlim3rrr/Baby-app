<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Elements</title>
<link rel="stylesheet" href="styles.css">
<style>
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-top:1rem;}
.elem-box{
  border-radius:10px;padding:1.5rem;font-size:1.5rem;
  cursor:pointer;background:#bbdefb;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
}
</style>
</head>
<body>
  <div class="container">
    <h1>Learn Elements 🌎</h1>
    <div class="grid">
      <div class="elem-box" onclick="say('wind')">💨<br>Wind</div>
      <div class="elem-box" onclick="say('earth')">🌏<br>Earth</div>
      <div class="elem-box" onclick="say('fire')">🔥<br>Fire</div>
      <div class="elem-box" onclick="say('rain')">💧<br>Rain</div>
    </div>
    <br><a href="dashboard.html" class="menu-btn">⬅ Back</a>
  </div>

  <script>
    function say(name){new Audio(`sounds/${name}.mp3`).play();}
  </script>
</body>
</html>
