<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Learning Time! 👋</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Welcome to Learning Time! 👶</h1>
    <p>Choose your profile or create a new one:</p>

    <div id="profiles" class="profile-list"></div>

    <div class="new-profile">
      <input id="newName" placeholder="Enter your name" />
      <button onclick="addProfile()">Add Profile</button>
    </div>
  </div>

  <script>
    const profilesDiv = document.getElementById('profiles');
    let profiles = JSON.parse(localStorage.getItem('profiles')) || [];

    function renderProfiles() {
      if (profiles.length === 0) {
        profilesDiv.innerHTML = `<p>No profiles yet — add one below!</p>`;
        return;
      }

      profilesDiv.innerHTML = profiles
        .map(
          (p, i) => `
            <div class="profile-card" onclick="openProfile(${i})">
              <h3>${p.name}</h3>
              <p>Progress: ${p.progress || 0}%</p>
            </div>`
        )
        .join('');
    }

    function addProfile() {
      const name = document.getElementById('newName').value.trim();
      if (!name) return alert('Please enter a name.');
      profiles.push({ name, progress: 0 });
      localStorage.setItem('profiles', JSON.stringify(profiles));
      renderProfiles();
      document.getElementById('newName').value = '';
    }

    function openProfile(index) {
      localStorage.setItem('activeProfile', index);
      window.location.href = 'dashboard.html';
    }

    renderProfiles();
  </script>
</body>
</html>
