<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container" id="dash"></div>

  <script>
    const profiles=JSON.parse(localStorage.getItem('profiles'))||[];
    const i=localStorage.getItem('activeProfile');
    const p=profiles[i];
    if(!p){location.href='index.html';}

    const dash=document.getElementById('dash');
    function render(){
      dash.innerHTML=`
        <h1>Hello, ${p.name}! 🌟</h1>
        <div class="progress-bar"><div class="progress" style="width:${p.progress||0}%"></div></div>
        <p>${p.progress||0}% complete</p>

        <div class="buttons">
          <a href="colors.html" class="menu-btn">🎨 Colors</a>
          <a href="numbers.html" class="menu-btn">🔢 Numbers</a>
          <a href="elements.html" class="menu-btn">🌏 Elements</a>
          <a href="objects.html" class="menu-btn">🧸 Objects</a>
          <button onclick="reset()">Reset</button>
          <button onclick="logout()">Switch User</button>
        </div>`;
    }

    function updateProgress(){
      p.progress = Math.min((p.progress||0)+5, 100);
      profiles[i]=p;
      localStorage.setItem('profiles',JSON.stringify(profiles));
      render();
    }

    window.addEventListener('lessonComplete', updateProgress);
    function reset(){p.progress=0;profiles[i]=p;localStorage.setItem('profiles',JSON.stringify(profiles));render();}
    function logout(){location.href='index.html';}
    render();
  </script>
</body>
</html>
