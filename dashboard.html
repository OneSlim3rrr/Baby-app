<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container" id="dashboard"></div>

  <script>
    const profiles = JSON.parse(localStorage.getItem('profiles')) || [];
    const activeIndex = localStorage.getItem('activeProfile');
    const profile = profiles[activeIndex];

    if (!profile) {
      window.location.href = 'index.html';
    }

    function updateDisplay() {
      document.getElementById('dashboard').innerHTML = `
        <h1>Hi, ${profile.name}! 🌟</h1>
        <p>Your progress: <strong>${profile.progress}%</strong></p>

        <div class="buttons">
          <button onclick="completeLesson()">Complete Lesson</button>
          <button onclick="resetProgress()">Reset Progress</button>
          <button onclick="logout()">Switch User</button>
        </div>
      `;
    }

    function completeLesson() {
      profile.progress = Math.min((profile.progress || 0) + 10, 100);
      profiles[activeIndex] = profile;
      localStorage.setItem('profiles', JSON.stringify(profiles));
      updateDisplay();
    }

    function resetProgress() {
      profile.progress = 0;
      profiles[activeIndex] = profile;
      localStorage.setItem('profiles', JSON.stringify(profiles));
      updateDisplay();
    }

    function logout() {
      window.location.href = 'index.html';
    }

    updateDisplay();
  </script>
</body>
</html>
