<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Colors</title>
<link rel="stylesheet" href="styles.css">
<style>
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-top:1rem;}
.color-box{height:120px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:white;}
</style>
</head>
<body>
  <div class="container">
    <h1>Learn Colors 🎨</h1>
    <div class="grid" id="grid"></div>
    <br><a href="dashboard.html" class="menu-btn">⬅ Back</a>
  </div>

  <script>// Auto progress +10% when visiting
const profiles=JSON.parse(localStorage.getItem('profiles'))||[];
const i=localStorage.getItem('activeProfile');
if(profiles[i]){
  profiles[i].progress=Math.min((profiles[i].progress||0)+10,100);
  localStorage.setItem('profiles',JSON.stringify(profiles));
}
    const colors = [
      ['Red','red'],['Blue','blue'],['Green','green'],
      ['Yellow','yellow'],['Orange','orange'],['Purple','purple'],
      ['Brown','brown'],['Black','black'],['White','white'],['Grey','grey']
    ];
    const grid=document.getElementById('grid');
    grid.innerHTML = colors.map(c=>`<div class="color-box" style="background:${c[1]}" onclick="say('${c[0]}')">${c[0]}</div>`).join('');
    function say(name){new Audio(`sounds/${name.split(' ')[0].toLowerCase()}.mp3`).play();}
  </script>
</body>
</html>
