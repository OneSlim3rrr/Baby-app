<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Colors</title>
<link rel="stylesheet" href="styles.css">
<style>
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-top:1rem;}
.color-box{height:120px;border-radius:10px;cursor:pointer;}
.red{background:red;} .blue{background:blue;}
.green{background:green;} .yellow{background:yellow;}
</style>
</head>
<body>
  <div class="container">
    <h1>Learn Colors 🎨</h1>
    <div class="grid">
      <div class="color-box red" onclick="say('red')"></div>
      <div class="color-box blue" onclick="say('blue')"></div>
      <div class="color-box green" onclick="say('green')"></div>
      <div class="color-box yellow" onclick="say('yellow')"></div>
    </div>
    <br>
    <a href="dashboard.html" class="menu-btn">⬅ Back</a>
  </div>

  <script>
    function say(color){
      const audio=new Audio(`sounds/${color}.mp3`);
      audio.play();
    }
  </script>
</body>
</html>
